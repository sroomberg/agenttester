[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agenttester"
version = "0.11.2"
description = "Run a prompt against multiple coding agents in parallel and compare results"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "typer>=0.9",
    "pyyaml>=6.0",
    "rich>=13.0",
    "gitpython>=3.1",
    "prompt-toolkit>=3.0",
]

[project.optional-dependencies]
aws = ["boto3>=1.34"]
dev = [
    "ruff>=0.4",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
agent-tester = "agenttester.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/agenttester"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["agenttester"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
